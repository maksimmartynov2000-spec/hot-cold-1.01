<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс Коро: Магическая Экономика</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&display=swap');
        
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(20, 24, 36, 0.9);
            --text-main: #e0e6ed;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --blue-card: #2980b9;
            --green-card: #27ae60;
            --red-card: #c0392b;
            --purple-card: #8e44ad;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: #0f111a url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 31.5V29h-2v2.5L25.5 24 28 26.5V29h2v-2.5L32.5 24 30 21.5z' fill='%23d4af37' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: linear-gradient(to bottom, rgba(15,17,26,1), rgba(15,17,26,0.8));
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .header-title { text-align: left; }
        h1 { font-family: 'Cinzel', serif; color: var(--gold); margin: 0; font-size: 1.8rem; text-shadow: 0 0 10px var(--gold-glow); }
        .subtitle { font-family: 'Cinzel', serif; color: #8892b0; font-size: 0.9rem; letter-spacing: 1px; }

        .nav-buttons { display: flex; gap: 15px; }

        button {
            background: linear-gradient(135deg, #3a2e24, #1a1510);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            font-size: 1.1rem;
            font-family: 'Cinzel', serif;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        button:hover:not(:disabled) { background: linear-gradient(135deg, #4a3b2e, #2a221a); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(212,175,55,0.3); }
        button:disabled { background: #222; color: #555; border-color: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        button.action-btn { background: linear-gradient(135deg, #c0392b, #8e44ad); color: white; border-color: #fff; }
        button.action-btn:hover:not(:disabled) { background: linear-gradient(135deg, #e74c3c, #9b59b6); }
        button.end-btn { background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; border-color: #fff; }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Views */
        #game-view { display: flex; flex-direction: column; gap: 20px; }
        #catalog-view { display: none; background: var(--panel-bg); border-radius: var(--border-radius); padding: 30px; border: 1px solid var(--gold); }

        .game-layout { display: flex; gap: 20px; width: 100%; align-items: flex-start;}
        @media(max-width: 1000px) { .game-layout { flex-direction: column; } }

        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .player-panel { flex: 1; }
        .market-panel { flex: 2; border: 1px solid rgba(136, 146, 176, 0.4); }

        h2, h3 { font-family: 'Cinzel', serif; margin-top: 0; color: var(--gold); border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 10px; }
        
        .stats { float: right; font-size: 1.4rem; background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 8px; border: 1px solid var(--gold); }
        .coins { font-weight: bold; color: #ffd700; text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }

        /* Controls */
        .controls {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); padding: 20px 30px; border-radius: var(--border-radius);
            border: 1px solid var(--gold); box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 10px; flex-wrap: wrap; gap: 20px;
        }
        
        .turn-info { flex: 1; }
        #turn-indicator { font-size: 1.6rem; font-family: 'Cinzel', serif; color: var(--gold); font-weight: bold; }
        #phase-indicator { font-size: 1.1rem; color: #aaa; font-style: italic; }

        .dice-area { display: flex; gap: 15px; align-items: center; justify-content: center; flex: 1; }
        .die { 
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2); color: #1a1a2e; 
            width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; 
            border-radius: 12px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.5); 
            font-size: 2.5rem; font-weight: bold; font-family: sans-serif;
        }

        .btn-group { display: flex; gap: 10px; flex: 1; justify-content: flex-end; flex-wrap: wrap; }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Premium Cards */
        .card {
            background-color: #1e1a18;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2.5L22.5 11 25 13.5V16h20v2H25v2.5L22.5 23 20 20.5zM11 22.5L13.5 25 11 27.5 8.5 25 11 22.5zM29 22.5L31.5 25 29 27.5 26.5 25 29 22.5zM11 8.5L13.5 11 11 13.5 8.5 11 11 8.5zM29 8.5L31.5 11 29 13.5 26.5 11 29 8.5z' fill='%23d4af37' fill-opacity='0.15' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: #f4ebd8;
            border-radius: 8px;
            padding: 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 170px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 4px 8px rgba(0,0,0,0.6);
            border: 2px solid #3a2e24;
            outline: 1px solid var(--gold);
            outline-offset: -4px;
        }

        .card:hover { transform: translateY(-5px); box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 8px 16px rgba(0,0,0,0.8); outline-color: #ffdf00; z-index: 10; }
        .card.disabled { filter: grayscale(60%) brightness(0.6); cursor: not-allowed; pointer-events: none; }
        .card.disabled:hover { transform: none; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); outline-color: var(--gold); z-index: 1;}

        .type-ribbon {
            position: absolute; top: 0; left: 0; width: 100%; height: 35px; border-radius: 6px 6px 0 0; opacity: 0.8; z-index: 1;
            mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
        }
        .card.blue .type-ribbon { background: linear-gradient(180deg, var(--blue-card), transparent); }
        .card.green .type-ribbon { background: linear-gradient(180deg, var(--green-card), transparent); }
        .card.red .type-ribbon { background: linear-gradient(180deg, var(--red-card), transparent); }
        .card.purple .type-ribbon { background: linear-gradient(180deg, var(--purple-card), transparent); }
        
        .card.landmark { outline: 2px solid #555; background-color: #111; }
        .card.landmark.built { outline: 2px solid var(--gold); background-color: #2a2210; box-shadow: inset 0 0 30px #000, 0 0 15px var(--gold-glow); pointer-events: none; }

        .card-header { display: flex; justify-content: space-between; align-items: center; z-index: 2; margin-bottom: 2px; }
        .card-triggers { background: #111; color: var(--gold); padding: 2px 5px; border-radius: 4px; font-family: 'Cinzel', serif; font-size: 1rem; border: 1px solid var(--gold); font-weight: bold; }
        .card-cost { background: linear-gradient(135deg, #d4af37, #aa8222); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 0.9rem; font-weight: bold; border: 1px solid #ffe680; }
        
        .card-title { font-weight: bold; text-align: center; font-size: 1rem; line-height: 1.1; color: var(--gold); font-family: 'Cinzel', serif; z-index: 2; margin: 4px 0; text-shadow: 2px 2px 4px #000;}
        
        .art-frame {
            background: radial-gradient(circle, rgba(74, 59, 44, 0.9), rgba(26, 21, 16, 1));
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 4px;
            margin: 2px 10px;
            padding: 5px 0;
            text-align: center;
            font-size: 2rem;
            box-shadow: inset 0 0 10px #000;
            z-index: 2;
        }

        .card-desc { font-size: 0.8rem; color: #b8ac97; line-height: 1.1; text-align: center; margin-top: 5px; z-index: 2; font-style: italic; }
        .card-tag { position: absolute; bottom: 5px; left: 5px; font-size: 0.7rem; background: #222; padding: 1px 4px; border-radius: 3px; border: 1px solid #444; color: #888; z-index: 2; }
        
        .card-count { 
            position: absolute; bottom: -8px; right: -8px; background: radial-gradient(circle, #c0392b, #7a150a); 
            color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; border: 2px solid var(--gold); z-index: 10; box-shadow: 0 4px 8px rgba(0,0,0,0.6); 
            font-family: 'Cinzel', serif; font-size: 1.1rem; 
        }

        /* Log */
        #log-container {
            width: 100%; background: var(--panel-bg); border-radius: var(--border-radius); border: 1px solid var(--gold); padding: 15px; margin-top: 10px;
        }
        #log {
            width: 100%; height: 180px; overflow-y: auto; background: rgba(0, 0, 0, 0.8); padding: 10px; border-radius: 6px; font-family: 'Courier New', monospace; border: 1px inset #333; color: #ddd;
        }
        .log-entry { margin: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 3px; font-size: 0.95rem; }
        .log-entry.turn { color: var(--gold); font-weight: bold; margin-top: 10px; border-bottom: 1px solid var(--gold); font-size: 1.05rem; }
        .log-entry.income { color: #2ecc71; }
        .log-entry.loss { color: #e74c3c; }
        .log-entry.error { color: #ff0000; font-weight: bold; background: rgba(255,0,0,0.2); padding: 5px; }

        /* Catalog specific */
        .catalog-section { margin-bottom: 30px; }
        .catalog-section h3 { border-bottom: 2px solid; padding-bottom: 5px; }
        .color-blue h3 { border-color: var(--blue-card); color: #5dade2;}
        .color-green h3 { border-color: var(--green-card); color: #58d68d;}
        .color-red h3 { border-color: var(--red-card); color: #ec7063;}
        .color-purple h3 { border-color: var(--purple-card); color: #af7ac5;}
        .color-landmark h3 { border-color: var(--gold); color: var(--gold);}

    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Хогвартс Коро</h1>
            <div class="subtitle">Магическая Экономика</div>
        </div>
        <div class="nav-buttons">
            <button id="btn-nav-game" onclick="switchView('game')" disabled>Игровая доска</button>
            <button id="btn-nav-catalog" onclick="switchView('catalog')">📖 Справочник карт</button>
        </div>
    </header>

    <div class="container">
        <!-- Game View -->
        <div id="game-view">
            
            <div class="controls">
                <div class="turn-info">
                    <div id="turn-indicator">Ход: Загрузка...</div>
                    <div id="phase-indicator">Подготовка игры</div>
                </div>
                <div class="dice-area" id="dice-container">
                    <div class="die" id="die1">-</div>
                    <div class="die" id="die2" style="display: none;">-</div>
                </div>
                <div class="btn-group">
                    <button id="btn-roll-1" class="action-btn" onclick="executeAction('roll', 1)">Бросить 1 кубик</button>
                    <button id="btn-roll-2" class="action-btn" onclick="executeAction('roll', 2)" style="display:none;">Бросить 2 кубика</button>
                    <button id="btn-end-turn" class="end-btn" onclick="executeAction('end')" style="display:none;">Завершить ход</button>
                </div>
            </div>

            <div class="game-layout">
                <!-- P1 -->
                <div class="panel player-panel" id="player-panel">
                    <h2>Вы <span class="stats"><span class="coins" id="p1-coins">0 💰</span></span></h2>
                    <div class="cards-grid" id="p1-landmarks"></div>
                    <h3 style="font-size: 1.1rem; margin-top: 15px;">Ваши предприятия</h3>
                    <div class="cards-grid" id="p1-cards"></div>
                </div>

                <!-- Market -->
                <div class="panel market-panel">
                    <h2>Косой Переулок (Рынок)</h2>
                    <div class="cards-grid" id="market-cards"></div>
                </div>

                <!-- P2 (AI) -->
                <div class="panel player-panel" id="ai-panel">
                    <h2>Малфой (ИИ) <span class="stats"><span class="coins" id="p2-coins">0 💰</span></span></h2>
                    <div class="cards-grid" id="p2-landmarks"></div>
                    <h3 style="font-size: 1.1rem; margin-top: 15px;">Предприятия Малфоя</h3>
                    <div class="cards-grid" id="p2-cards"></div>
                </div>
            </div>

            <div id="log-container">
                <h3 style="margin: 0 0 10px 0; font-size: 1.1rem;">История событий</h3>
                <div id="log"></div>
            </div>
        </div>

        <!-- Catalog View -->
        <div id="catalog-view">
            <h2 style="text-align: center; font-size: 2.5rem; margin-bottom: 10px;">Справочник Всех Карт</h2>
            <p style="text-align: center; color: #aaa; margin-bottom: 30px;">Полный список предприятий и достопримечательностей Магического Мира</p>
            <div id="catalog-content"></div>
        </div>
    </div>

<script>
    // --- DATABASE ---
    const DB = [
        { id:'c1', name:'Теплица', type:'blue', tag:'plant', cost:1, tr:[1], val:1, icon:'🌱', desc:'1 💰 из банка' },
        { id:'c2', name:'Гиппогрифы', type:'blue', tag:'creature', cost:1, tr:[2], val:1, icon:'🦅', desc:'1 💰 из банка' },
        { id:'c3', name:'Запретный лес', type:'blue', tag:'gear', cost:3, tr:[5], val:1, icon:'🌲', desc:'1 💰 из банка' },
        { id:'c4', name:'Цапучая ива', type:'blue', tag:'plant', cost:3, tr:[4], val:3, icon:'🌳', desc:'3 💰 из банка' },
        { id:'c5', name:'Лодка на озере', type:'blue', tag:'boat', cost:2, tr:[8], val:3, icon:'⛵', desc:'3 💰 из банка' },
        { id:'c6', name:'Шахта Гринготтс', type:'blue', tag:'gear', cost:6, tr:[9], val:5, icon:'⛏️', desc:'5 💰 из банка' },
        { id:'c7', name:'Тыквен. грядка', type:'blue', tag:'plant', cost:3, tr:[10], val:3, icon:'🎃', desc:'3 💰 из банка' },
        { id:'c8', name:'Корабль', type:'blue', tag:'boat', cost:5, tr:[12,13,14], val:0, icon:'🛳️', desc:'Доход равен сумме броска' },
        
        { id:'c9', name:'Сладкое корол.', type:'green', tag:'shop', cost:1, tr:[2,3], val:1, icon:'🍬', desc:'1 💰 из банка' },
        { id:'c10', name:'Олливандер', type:'green', tag:'shop', cost:2, tr:[4], val:3, icon:'🪄', desc:'3 💰 из банка' },
        { id:'c11', name:'Зельеварня', type:'green', tag:'factory', cost:5, tr:[7], val:3, combo:'creature', icon:'⚗️', desc:'3 💰 за каждое Существо (🦅)' },
        { id:'c12', name:'Фабр. метел', type:'green', tag:'factory', cost:3, tr:[8], val:3, combo:'gear', icon:'🧹', desc:'3 💰 за каждый Ресурс (🌲/⛏️)' },
        { id:'c13', name:'Рынок ингр.', type:'green', tag:'factory', cost:2, tr:[11,12], val:2, combo:'plant', icon:'📜', desc:'2 💰 за каждое Растение (🌱/🌳/🎃)' },
        
        { id:'c14', name:'Кафе Паддифут', type:'red', tag:'cafe', cost:2, tr:[3], val:1, icon:'☕', desc:'Забирает 1 💰 у бросившего' },
        { id:'c15', name:'Три метлы', type:'red', tag:'cafe', cost:1, tr:[7], val:1, icon:'🍺', desc:'Забирает 1 💰 у бросившего' },
        { id:'c16', name:'Кабанья голова', type:'red', tag:'cafe', cost:1, tr:[8], val:1, icon:'🐗', desc:'Забирает 1 💰 у бросившего' },
        { id:'c17', name:'Дырявый котел', type:'red', tag:'cafe', cost:3, tr:[9,10], val:2, icon:'🍲', desc:'Забирает 2 💰 у бросившего' },

        { id:'c18', name:'Стадион', type:'purple', tag:'special', cost:6, tr:[6], val:0, icon:'🏟️', desc:'Забирает по 2 💰 у всех' },
        { id:'c19', name:'Пророк', type:'purple', tag:'special', cost:7, tr:[6], val:0, icon:'📰', desc:'Забирает 5 💰 у одного' },
        { id:'c20', name:'Налог Мин-ва', type:'purple', tag:'special', cost:4, tr:[8,9], val:0, icon:'⚖️', desc:'Забирает половину 💰 у богачей' }
    ];

    const LandmarksDB = [
        { id: 'l1', key: 'port', name: 'Порт', cost: 2, desc: 'Бросок >= 10 дает +2 (Автоматически)' },
        { id: 'l2', key: 'station', name: 'Вокзал Кингс-Кросс', cost: 4, desc: 'Позволяет бросать 2 кубика' },
        { id: 'l3', key: 'mall', name: 'Косой Переулок', cost: 10, desc: 'Магазины и Кафе (🍬/☕) дают +1 💰' },
        { id: 'l4', key: 'park', name: 'Замок Хогвартс', cost: 16, desc: 'Дубль при 2 кубиках дает доп. ход' },
        { id: 'l5', key: 'tower', name: 'Отдел Тайн', cost: 22, desc: 'Переброс если результат < 6 (Авто)' },
        { id: 'l6', key: 'airport', name: 'Аэропорт магов', cost: 30, desc: 'Если ничего не купили: +10 💰' }
    ];

    let state = {
        players: [
            { name: 'Вы', isAI: false, coins: 3, cards: { 'c1': 1, 'c9': 1 }, landmarks: {} },
            { name: 'Малфой', isAI: true, coins: 3, cards: { 'c1': 1, 'c9': 1 }, landmarks: {} }
        ],
        activePlayer: 0,
        phase: 'roll',
        market: {},
        deck: [],
        lastRoll: 0,
        isDouble: false
    };

    function logMsg(msg, type='') {
        try {
            const l = document.getElementById('log');
            if (l) {
                l.innerHTML += `<div class="log-entry ${type}">${msg}</div>`;
                l.scrollTop = l.scrollHeight;
            }
        } catch (e) { console.error("Log err", e); }
    }

    function replenishMarket() {
        while(Object.keys(state.market).length < 10 && state.deck.length > 0) {
            let cid = state.deck.pop();
            state.market[cid] = (state.market[cid] || 0) + 1;
        }
    }

    function executeAction(action, param) {
        try {
            if (state.phase === 'end' || state.players[state.activePlayer].isAI) return;
            
            if (action === 'roll' && state.phase === 'roll') {
                performRoll(param);
            } else if (action === 'buy' && state.phase === 'buy') {
                buyCard(param);
            } else if (action === 'buy_l' && state.phase === 'buy') {
                buyLandmark(param);
            } else if (action === 'end' && state.phase === 'buy') {
                endTurn();
            }
        } catch (e) {
            logMsg(`Ошибка: ${e.message}`, 'error');
        }
    }

    function performRoll(numDice) {
        let p = state.players[state.activePlayer];
        let d1 = Math.floor(Math.random() * 6) + 1;
        let d2 = numDice === 2 ? Math.floor(Math.random() * 6) + 1 : 0;
        let total = d1 + d2;
        state.isDouble = (numDice === 2 && d1 === d2);
        
        document.getElementById('die1').innerText = d1;
        if(d2 > 0) {
            document.getElementById('die2').innerText = d2;
            document.getElementById('die2').style.display = 'flex';
        } else {
            document.getElementById('die2').style.display = 'none';
        }

        logMsg(`${p.name} бросает: ${d1}${d2 ? ' + '+d2 : ''} = ${total}`, 'turn');

        if (p.landmarks.tower && total <= 5 && !p.isAI) {
            logMsg(`<i>Отдел Тайн: автоматический переброс плохих кубиков...</i>`);
            d1 = Math.floor(Math.random() * 6) + 1;
            d2 = numDice === 2 ? Math.floor(Math.random() * 6) + 1 : 0;
            total = d1 + d2;
            state.isDouble = (numDice === 2 && d1 === d2);
            document.getElementById('die1').innerText = d1;
            if(d2 > 0) document.getElementById('die2').innerText = d2;
            logMsg(`Новый результат: ${total}`);
        }

        if (p.landmarks.port && total >= 10) {
            total += 2;
            logMsg(`<i>Порт Хогвартса прибавляет +2. Итого: ${total}</i>`);
        }

        state.lastRoll = total;
        resolveIncome(total);
        
        state.phase = 'buy';
        updateUI();

        if (state.players[state.activePlayer].isAI) {
            setTimeout(aiBuyPhase, 1500);
        }
    }

    function resolveIncome(roll) {
        let pAct = state.players[state.activePlayer];
        let pOth = state.players[(state.activePlayer + 1) % 2];

        // 1. RED
        let redOwed = 0;
        Object.keys(pOth.cards).forEach(cid => {
            let c = DB.find(x => x.id === cid);
            if (c.type === 'red' && c.tr.includes(roll)) {
                let amount = c.val + (pOth.landmarks.mall ? 1 : 0);
                redOwed += amount * pOth.cards[cid];
            }
        });
        if (redOwed > 0) {
            let paid = Math.min(redOwed, pAct.coins);
            pAct.coins -= paid; pOth.coins += paid;
            logMsg(`${pAct.name} платит ${paid} 💰 ${pOth.name} (Кафе/Пабы)`, 'loss');
        }

        // 2. BLUE
        state.players.forEach(p => {
            let blueGain = 0;
            Object.keys(p.cards).forEach(cid => {
                let c = DB.find(x => x.id === cid);
                if (c.type === 'blue' && c.tr.includes(roll)) {
                    let amount = c.id === 'c8' ? roll : c.val;
                    blueGain += amount * p.cards[cid];
                }
            });
            if (blueGain > 0) {
                p.coins += blueGain;
                logMsg(`${p.name} получает ${blueGain} 💰 (Синие карты)`, 'income');
            }
        });

        // 3. GREEN
        let greenGain = 0;
        Object.keys(pAct.cards).forEach(cid => {
            let c = DB.find(x => x.id === cid);
            if (c.type === 'green' && c.tr.includes(roll)) {
                let amount = c.val;
                if (c.tag === 'shop' && pAct.landmarks.mall) amount += 1;
                
                if (c.combo) {
                    let count = 0;
                    Object.keys(pAct.cards).forEach(checkId => {
                        let checkC = DB.find(x => x.id === checkId);
                        if (checkC.tag === c.combo) count += pAct.cards[checkId];
                    });
                    amount = amount * count;
                }
                greenGain += amount * pAct.cards[cid];
            }
        });
        if (greenGain > 0) {
            pAct.coins += greenGain;
            logMsg(`${pAct.name} получает ${greenGain} 💰 (Зеленые карты)`, 'income');
        }

        // 4. PURPLE
        Object.keys(pAct.cards).forEach(cid => {
            let c = DB.find(x => x.id === cid);
            if (c.type === 'purple' && c.tr.includes(roll)) {
                if (cid === 'c18') {
                    let steal = Math.min(2, pOth.coins);
                    pOth.coins -= steal; pAct.coins += steal;
                    logMsg(`Квиддич! ${pAct.name} забирает ${steal} 💰`, 'income');
                } else if (cid === 'c19') {
                    let steal = Math.min(5, pOth.coins);
                    pOth.coins -= steal; pAct.coins += steal;
                    logMsg(`Пророк! ${pAct.name} забирает ${steal} 💰`, 'income');
                } else if (cid === 'c20') {
                    if (pOth.coins >= 10) {
                        let steal = Math.floor(pOth.coins / 2);
                        pOth.coins -= steal; pAct.coins += steal;
                        logMsg(`Налог! ${pAct.name} конфискует ${steal} 💰`, 'income');
                    }
                }
            }
        });
    }

    function buyCard(id) {
        let p = state.players[state.activePlayer];
        let c = DB.find(x => x.id === id);
        if (p.coins >= c.cost && state.market[id] > 0) {
            if (c.type === 'purple' && p.cards[id]) { logMsg('Фиолетовая карта уже есть!', 'error'); return; }
            
            p.coins -= c.cost;
            state.market[id]--;
            if (state.market[id] === 0) delete state.market[id];
            
            p.cards[id] = (p.cards[id] || 0) + 1;
            logMsg(`<b>${p.name} покупает ${c.name}</b>`);
            
            replenishMarket();
            concludeTurn();
        }
    }

    function buyLandmark(key) {
        let p = state.players[state.activePlayer];
        let l = LandmarksDB.find(x => x.key === key);
        if (p.coins >= l.cost && !p.landmarks[key]) {
            p.coins -= l.cost;
            p.landmarks[key] = true;
            logMsg(`<b style="color:var(--gold); font-size:1.1em;">${p.name} построил: ${l.name}!</b>`);
            
            if (Object.values(p.landmarks).filter(x=>x).length === LandmarksDB.length) {
                logMsg(`<h2>🎉 ${p.name.toUpperCase()} ПОБЕЖДАЕТ! 🎉</h2>`);
                state.phase = 'end';
                updateUI();
                return;
            }
            concludeTurn();
        }
    }

    function endTurn() {
        let p = state.players[state.activePlayer];
        if (p.landmarks.airport) {
            p.coins += 10;
            logMsg(`${p.name} получает +10 💰 от Аэропорта (ничего не куплено)`, 'income');
        }
        concludeTurn();
    }

    function concludeTurn() {
        let p = state.players[state.activePlayer];
        if (p.landmarks.park && state.isDouble) {
            logMsg(`<b>Замок Хогвартс дарует доп. ход за дубль!</b>`, 'turn');
            state.phase = 'roll';
            updateUI();
            if (p.isAI) setTimeout(aiTurn, 1500);
            return;
        }

        state.activePlayer = (state.activePlayer + 1) % 2;
        state.phase = 'roll';
        updateUI();

        if (state.players[state.activePlayer].isAI) {
            setTimeout(aiTurn, 1500);
        }
    }

    function aiTurn() {
        if(state.phase !== 'roll') return;
        let p = state.players[1];
        let dice = p.landmarks.station ? (Math.random() > 0.4 ? 2 : 1) : 1;
        performRoll(dice);
    }

    function aiBuyPhase() {
        if (state.phase !== 'buy') return;
        let p = state.players[1];
        let bought = false;

        for (let l of LandmarksDB) {
            if (!p.landmarks[l.key] && p.coins >= l.cost) {
                buyLandmark(l.key);
                return;
            }
        }

        let affordable = Object.keys(state.market).filter(id => {
            let c = DB.find(x => x.id === id);
            if (c.type === 'purple' && p.cards[id]) return false;
            return c.cost <= p.coins;
        });

        if (affordable.length > 0) {
            affordable.sort((a,b) => DB.find(x=>x.id===b).cost - DB.find(x=>x.id===a).cost);
            let pick = affordable[0];
            if(Math.random() > 0.3) pick = affordable[Math.floor(Math.random() * affordable.length)];
            
            buyCard(pick);
            return;
        }

        endTurn();
    }

    function renderCard(c, count=0, interactive=false, onClickStr='') {
        let classes = `card ${c.type} ${!interactive ? 'disabled' : ''}`;
        return `
            <div class="${classes}" ${interactive ? `onclick="${onClickStr}"` : ''}>
                <div class="type-ribbon"></div>
                <div class="card-header">
                    <span class="card-triggers">[${c.tr.join(',')}]</span>
                    <span class="card-cost">${c.cost} 💰</span>
                </div>
                <div class="card-title">${c.name}</div>
                <div class="art-frame">${c.icon}</div>
                <div class="card-desc">${c.desc}</div>
                <div class="card-tag">${c.tag}</div>
                ${count > 0 ? `<div class="card-count">${count}</div>` : ''}
            </div>
        `;
    }

    function renderLandmark(l, built, interactive, onClickStr='') {
        let classes = `card landmark ${built ? 'built' : ''} ${(!built && !interactive) ? 'disabled' : ''}`;
        return `
            <div class="${classes}" ${interactive ? `onclick="${onClickStr}"` : ''}>
                <div class="card-header">
                    <span style="font-weight:bold; color:var(--gold);">${l.name}</span>
                    <span class="card-cost">${l.cost} 💰</span>
                </div>
                <div class="card-desc" style="margin-top:15px; font-size:0.9rem;">${l.desc}</div>
            </div>
        `;
    }

    function updateUI() {
        try {
            let pAct = state.players[state.activePlayer];
            
            document.getElementById('turn-indicator').innerText = state.phase === 'end' ? 'Игра окончена' : `Ход: ${pAct.name}`;
            document.getElementById('phase-indicator').innerText = state.phase === 'roll' ? 'Бросок кубиков' : state.phase === 'buy' ? 'Фаза покупки' : '';

            let isHuman = !pAct.isAI;
            document.getElementById('btn-roll-1').style.display = (state.phase === 'roll' && isHuman) ? 'inline-block' : 'none';
            document.getElementById('btn-roll-2').style.display = (state.phase === 'roll' && isHuman && pAct.landmarks.station) ? 'inline-block' : 'none';
            document.getElementById('btn-end-turn').style.display = (state.phase === 'buy' && isHuman) ? 'inline-block' : 'none';

            [0, 1].forEach(idx => {
                let p = state.players[idx];
                let prefix = idx === 0 ? 'p1' : 'p2';
                
                document.getElementById(`${prefix}-coins`).innerText = `${p.coins} 💰`;
                
                let lHTML = LandmarksDB.map(l => {
                    let built = p.landmarks[l.key];
                    let canBuy = (!built && state.phase === 'buy' && state.activePlayer === idx && isHuman && p.coins >= l.cost);
                    return renderLandmark(l, built, canBuy, `executeAction('buy_l', '${l.key}')`);
                }).join('');
                document.getElementById(`${prefix}-landmarks`).innerHTML = lHTML;

                let cHTML = Object.keys(p.cards).map(id => {
                    return renderCard(DB.find(x=>x.id===id), p.cards[id], false);
                }).join('');
                document.getElementById(`${prefix}-cards`).innerHTML = cHTML;
            });

            let mHTML = Object.keys(state.market).map(id => {
                let c = DB.find(x=>x.id===id);
                let p = state.players[0];
                let canBuy = (state.phase === 'buy' && state.activePlayer === 0 && p.coins >= c.cost && !(c.type==='purple' && p.cards[id]));
                return renderCard(c, state.market[id], canBuy, `executeAction('buy', '${id}')`);
            }).join('');
            document.getElementById('market-cards').innerHTML = mHTML;
        } catch (e) {
            logMsg(`Ошибка рендера: ${e.message}`, 'error');
        }
    }

    function switchView(view) {
        document.getElementById('game-view').style.display = view === 'game' ? 'flex' : 'none';
        document.getElementById('catalog-view').style.display = view === 'catalog' ? 'block' : 'none';
        document.getElementById('btn-nav-game').disabled = view === 'game';
        document.getElementById('btn-nav-catalog').disabled = view === 'catalog';
    }

    function buildCatalog() {
        let content = '';
        let types = [
            { id: 'blue', name: 'Синие карты (Доход в любой ход)' },
            { id: 'green', name: 'Зеленые карты (Доход в свой ход)' },
            { id: 'red', name: 'Красные карты (Штраф соперникам)' },
            { id: 'purple', name: 'Фиолетовые карты (Особые здания)' }
        ];

        types.forEach(t => {
            let cards = DB.filter(c => c.type === t.id).sort((a,b) => a.tr[0] - b.tr[0]);
            content += `<div class="catalog-section color-${t.id}"><h3>${t.name}</h3><div class="cards-grid">`;
            cards.forEach(c => { content += renderCard(c, 0, true); }); 
            content += `</div></div>`;
        });

        content += `<div class="catalog-section color-landmark"><h3>Достопримечательности (Для победы нужно построить все)</h3><div class="cards-grid">`;
        LandmarksDB.forEach(l => { content += renderLandmark(l, false, true); });
        content += `</div></div>`;

        document.getElementById('catalog-content').innerHTML = content;
    }

    function initGame() {
        try {
            LandmarksDB.forEach(l => {
                state.players[0].landmarks[l.key] = false;
                state.players[1].landmarks[l.key] = false;
            });
            DB.forEach(c => {
                let copies = c.type === 'purple' ? 4 : 6;
                for(let i=0; i<copies; i++) state.deck.push(c.id);
            });
            state.deck.sort(() => Math.random() - 0.5);
            replenishMarket();
            buildCatalog();
            updateUI();
            logMsg('Игра началась! Бросайте кубик.', 'turn');
        } catch (e) {
            logMsg(`Ошибка инициализации: ${e.message}`, 'error');
        }
    }

    // Direct initialization instead of window.onload
    initGame();
</script>
</body>
</html>
