<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс Коро: Магическая Экономика</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --gold: #d4af37;
            --red: #8b0000;
            --blue-card: #4a90e2;
            --green-card: #2ecc71;
            --red-card: #e74c3c;
            --purple-card: #9b59b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--gold); text-shadow: 2px 2px 4px #000; margin-bottom: 5px; text-align: center;}
        p.subtitle { margin-top: 0; color: #aaa; margin-bottom: 20px; text-align: center;}

        .game-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            gap: 20px;
        }

        .player-panel, .market-panel {
            background: #2a2a40;
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .player-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .market-panel {
            flex: 2;
        }

        h2 { margin-top: 0; color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 5px; }

        .stats {
            font-size: 1.2em;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .coins { font-weight: bold; color: var(--gold); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: #eee;
            color: #111;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.85em;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .card:hover { transform: scale(1.05); }
        
        .card.disabled { opacity: 0.5; cursor: not-allowed; }
        .card.disabled:hover { transform: none; }

        .card.blue { border-top: 5px solid var(--blue-card); }
        .card.green { border-top: 5px solid var(--green-card); }
        .card.red { border-top: 5px solid var(--red-card); }
        .card.purple { border-top: 5px solid var(--purple-card); }
        .card.landmark { border-top: 5px solid var(--gold); background: #fff8e7; }
        .card.landmark.built { background: var(--gold); color: #000; }

        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px;}
        .card-cost { background: var(--gold); color: #000; padding: 2px 5px; border-radius: 3px; font-size: 0.9em;}
        .card-triggers { background: #333; color: #fff; padding: 2px 5px; border-radius: 3px; }
        .card-count { position: absolute; bottom: -10px; right: -10px; background: #e74c3c; color: white; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; z-index: 10;}

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .dice-area {
            font-size: 3em;
            margin: 10px 0;
            display: flex;
            gap: 15px;
        }

        .die { background: white; color: black; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; border-radius: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }

        button {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px;
        }

        button:hover:not(:disabled) { background: #a00000; }
        button:disabled { background: #555; cursor: not-allowed; }

        #log {
            width: 100%;
            height: 150px;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
            border: 1px solid #333;
        }

        .log-entry { margin: 3px 0; border-bottom: 1px dashed #333; padding-bottom: 2px; }
        .log-entry.turn { color: var(--gold); font-weight: bold; margin-top: 10px; }
        .log-entry.income { color: var(--green-card); }
        .log-entry.loss { color: var(--red-card); }

        @media(max-width: 900px) {
            .game-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>Хогвартс Коро</h1>
    <p class="subtitle">Мачи Коро: Издание Волшебного Мира (с правилом рынка из "Гавани")</p>

    <div class="controls">
        <div id="turn-indicator" style="font-size: 1.2em; color: var(--gold); margin-bottom: 10px;">Ход: Игрок (Ожидание броска)</div>
        <div class="dice-area" id="dice-container">
            <div class="die" id="die1">?</div>
            <div class="die" id="die2" style="display: none;">?</div>
        </div>
        <div>
            <button id="btn-roll-1" onclick="rollDice(1)">Бросить 1 кубик</button>
            <button id="btn-roll-2" onclick="rollDice(2)" style="display:none;">Бросить 2 кубика</button>
            <button id="btn-end-turn" onclick="endTurn()" style="display:none; background: var(--green-card);">Завершить ход</button>
        </div>
    </div>

    <div class="game-container">
        <!-- Player 1 -->
        <div class="player-panel" id="player-panel">
            <h2>Вы <span class="stats"><span class="coins" id="p1-coins">3 Галеона</span></span></h2>
            <div class="cards-grid" id="p1-landmarks"></div>
            <h3>Ваши предприятия:</h3>
            <div class="cards-grid" id="p1-cards"></div>
        </div>

        <!-- Market -->
        <div class="market-panel">
            <h2>Косой Переулок (Рынок)</h2>
            <div class="cards-grid" id="market-cards"></div>
        </div>

        <!-- AI Player -->
        <div class="player-panel" id="ai-panel">
            <h2>Малфой (ИИ) <span class="stats"><span class="coins" id="p2-coins">3 Галеона</span></span></h2>
            <div class="cards-grid" id="p2-landmarks"></div>
            <h3>Предприятия ИИ:</h3>
            <div class="cards-grid" id="p2-cards"></div>
        </div>
    </div>

    <div id="log"></div>

<script>
    // --- Data ---
    const cardDatabase = [
        // Blue (Anyone's turn)
        { id: 'c1', name: 'Теплица с мандрагорами', type: 'blue', cost: 1, triggers: [1], effectDesc: '1 Галеон из банка', icon: '🌱' },
        { id: 'c2', name: 'Заповедник гиппогрифов', type: 'blue', cost: 1, triggers: [2], effectDesc: '1 Галеон из банка', icon: '🦅' },
        { id: 'c3', name: 'Заросли цапучей ивы', type: 'blue', cost: 3, triggers: [4], effectDesc: '3 Галеона из банка', icon: '🌳' }, // Flower Orchard
        { id: 'c4', name: 'Лодка на Черном озере', type: 'blue', cost: 2, triggers: [8], effectDesc: '3 Галеона из банка', icon: '⛵' }, // Mackerel Boat
        { id: 'c5', name: 'Шахта гоблинов', type: 'blue', cost: 6, triggers: [9], effectDesc: '5 Галеонов из банка', icon: '⛏️' }, // Mine
        { id: 'c6', name: 'Тыквенная грядка', type: 'blue', cost: 3, triggers: [10], effectDesc: '3 Галеона из банка', icon: '🎃' }, // Apple Orchard
        
        // Green (Your turn)
        { id: 'c7', name: 'Сладкое королевство', type: 'green', cost: 1, triggers: [2, 3], effectDesc: '1 Галеон из банка', icon: '🍬' }, // Bakery
        { id: 'c8', name: 'Лавка Олливандера', type: 'green', cost: 2, triggers: [4], effectDesc: '3 Галеона из банка', icon: '🪄' }, // Convenience Store
        { id: 'c9', name: 'Зельеварня', type: 'green', cost: 5, triggers: [7], effectDesc: '3 Галеона за каждое Существо (🦅)', icon: '⚗️', comboIcon: '🦅' }, // Cheese Factory
        { id: 'c10', name: 'Фабрика метел', type: 'green', cost: 3, triggers: [8], effectDesc: '3 Галеона за каждые Артефакты (🪄/⛏️)', icon: '🧹', comboIcon: '🪄' }, // Furniture
        { id: 'c11', name: 'Рынок ингредиентов', type: 'green', cost: 2, triggers: [11, 12], effectDesc: '2 Галеона за каждое Растение (🌱/🌳/🎃)', icon: '📜', comboIcon: '🌱' }, // Fruit Market

        // Red (Take from roller)
        { id: 'c12', name: 'Кафе мадам Паддифут', type: 'red', cost: 2, triggers: [3], effectDesc: 'Забирает 1 Галеон у бросившего', icon: '☕' }, // Cafe
        { id: 'c13', name: 'Паб "Три метлы"', type: 'red', cost: 1, triggers: [7], effectDesc: 'Забирает 1 Галеон у бросившего', icon: '🍺' }, // Pizza
        { id: 'c14', name: 'Дырявый котел', type: 'red', cost: 3, triggers: [9, 10], effectDesc: 'Забирает 2 Галеона у бросившего', icon: '🍲' }, // Family Restaurant

        // Purple (Your turn, special)
        { id: 'c15', name: 'Стадион для квиддича', type: 'purple', cost: 6, triggers: [6], effectDesc: 'Забирает по 2 Галеона у всех', icon: '🏟️' }, // Stadium
        { id: 'c16', name: 'Ежедневный пророк', type: 'purple', cost: 7, triggers: [6], effectDesc: 'Забирает 5 Галеонов у одного (ИИ)', icon: '📰' }, // TV Station
        { id: 'c17', name: 'Налог Министерства', type: 'purple', cost: 4, triggers: [8, 9], effectDesc: 'Забирает половину у богачей (>=10)', icon: '⚖️' } // Tax Office
    ];

    const landmarksData = [
        { id: 'l1', name: 'Порт Хогвартса', cost: 2, effectDesc: 'Если бросок >= 10, можно +2 (Автоматически)', key: 'port' },
        { id: 'l2', name: 'Вокзал Кингс-Кросс', cost: 4, effectDesc: 'Позволяет бросать 2 кубика', key: 'station' },
        { id: 'l3', name: 'Косой Переулок', cost: 10, effectDesc: 'Кафе и Пабы (☕/🍺/🍲) приносят +1 монету', key: 'mall' },
        { id: 'l4', name: 'Замок Хогвартс', cost: 16, effectDesc: 'Если выпал дубль — дополнительный ход', key: 'park' },
        { id: 'l5', name: 'Отдел Тайн', cost: 22, effectDesc: 'Можно перебросить кубики 1 раз (Автоматически при < 6)', key: 'tower' },
        { id: 'l6', name: 'Аэропорт магов', cost: 30, effectDesc: 'Если ничего не купили в свой ход — +10 Галеонов', key: 'airport' }
    ];

    // --- State ---
    let players = [
        { name: 'Вы', coins: 3, cards: {}, landmarks: {}, isAI: false },
        { name: 'Малфой (ИИ)', coins: 3, cards: {}, landmarks: {}, isAI: true }
    ];
    let deck = [];
    let market = {};
    let activePlayer = 0;
    let turnPhase = 'roll'; // roll -> buy
    let currentRoll = 0;
    let doubleRolled = false;
    let extraTurn = false;

    // --- Initialization ---
    function initGame() {
        // Init player starting cards
        players.forEach(p => {
            p.cards['c1'] = 1; // 1 Wheat
            p.cards['c7'] = 1; // 1 Bakery
            landmarksData.forEach(l => p.landmarks[l.key] = false);
        });

        // Build Deck (6 of each except Purple which has 4)
        cardDatabase.forEach(c => {
            let count = c.type === 'purple' ? 4 : 6;
            for(let i=0; i<count; i++) deck.push(c.id);
        });
        shuffle(deck);
        replenishMarket();
        updateUI();
        log('Игра началась! Вы ходите первым.');
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // "Harbor" expansion rule: Market must have 10 unique establishments
    function replenishMarket() {
        while(Object.keys(market).length < 10 && deck.length > 0) {
            let cardId = deck.pop();
            market[cardId] = (market[cardId] || 0) + 1;
        }
    }

    // --- Core Logic ---
    function rollDice(num) {
        if (turnPhase !== 'roll') return;
        
        let d1 = Math.floor(Math.random() * 6) + 1;
        let d2 = num === 2 ? Math.floor(Math.random() * 6) + 1 : 0;
        currentRoll = d1 + d2;
        doubleRolled = (num === 2 && d1 === d2);
        
        document.getElementById('die1').innerText = d1;
        document.getElementById('die2').innerText = d2 > 0 ? d2 : '';
        document.getElementById('die2').style.display = d2 > 0 ? 'flex' : 'none';

        log(`<span class="turn">${players[activePlayer].name} бросает кубики: ${d1}${d2 ? ' + '+d2 : ''} = ${currentRoll}</span>`);

        let p = players[activePlayer];

        // Landmark: Tower (Reroll)
        if (p.landmarks.tower && currentRoll <= 5 && !p.isAI) {
            // Simplified automatic reroll for basic implementation
            log(`<i>Отдел Тайн перебрасывает плохой результат...</i>`);
            d1 = Math.floor(Math.random() * 6) + 1;
            d2 = num === 2 ? Math.floor(Math.random() * 6) + 1 : 0;
            currentRoll = d1 + d2;
            doubleRolled = (num === 2 && d1 === d2);
            document.getElementById('die1').innerText = d1;
            document.getElementById('die2').innerText = d2 > 0 ? d2 : '';
            log(`Новый результат: ${currentRoll}`);
        }

        // Landmark: Port
        if (p.landmarks.port && currentRoll >= 10) {
            currentRoll += 2;
            log(`<i>Порт Хогвартса увеличивает результат до ${currentRoll}</i>`);
        }

        processIncome(currentRoll);

        turnPhase = 'buy';
        updateUI();

        if (players[activePlayer].isAI) {
            setTimeout(aiBuyPhase, 1500);
        }
    }

    function processIncome(roll) {
        let pActive = players[activePlayer];
        let pOther = players[(activePlayer + 1) % 2];

        // 1. RED (Counter-clockwise, so Other Player gets from Active)
        let redOwed = 0;
        Object.keys(pOther.cards).forEach(cid => {
            let c = cardDatabase.find(x => x.id === cid);
            if (c.type === 'red' && c.triggers.includes(roll)) {
                let amount = (c.id === 'c14' ? 2 : 1);
                if (pOther.landmarks.mall) amount += 1; // Landmark: Mall buff
                redOwed += amount * pOther.cards[cid];
            }
        });
        if (redOwed > 0) {
            let actualPay = Math.min(redOwed, pActive.coins);
            pActive.coins -= actualPay;
            pOther.coins += actualPay;
            log(`<span class="loss">${pActive.name} платит ${actualPay} ☕ ${pOther.name}</span>`);
        }

        // 2. BLUE (Everyone gets from bank simultaneously)
        players.forEach(p => {
            let blueGain = 0;
            Object.keys(p.cards).forEach(cid => {
                let c = cardDatabase.find(x => x.id === cid);
                if (c.type === 'blue' && c.triggers.includes(roll)) {
                    let base = (c.id === 'c5' ? 5 : (c.id === 'c3' || c.id === 'c4' || c.id === 'c6' ? 3 : 1));
                    blueGain += base * p.cards[cid];
                }
            });
            if (blueGain > 0) {
                p.coins += blueGain;
                log(`<span class="income">${p.name} получает ${blueGain} из банка (Синие карты)</span>`);
            }
        });

        // 3. GREEN (Active player only)
        let greenGain = 0;
        Object.keys(pActive.cards).forEach(cid => {
            let c = cardDatabase.find(x => x.id === cid);
            if (c.type === 'green' && c.triggers.includes(roll)) {
                let base = 0;
                if (cid === 'c7') base = 1 + (pActive.landmarks.mall ? 1 : 0); // Bakery
                else if (cid === 'c8') base = 3; // Store
                else if (cid === 'c9') { // Potion (Cow combo)
                    let cows = pActive.cards['c2'] || 0;
                    base = 3 * cows;
                } else if (cid === 'c10') { // Broom (Gear combo)
                    let gears = (pActive.cards['c5'] || 0) + (pActive.cards['c8'] || 0);
                    base = 3 * gears;
                } else if (cid === 'c11') { // Market (Wheat combo)
                    let wheat = (pActive.cards['c1'] || 0) + (pActive.cards['c3'] || 0) + (pActive.cards['c6'] || 0);
                    base = 2 * wheat;
                }
                greenGain += base * pActive.cards[cid];
            }
        });
        if (greenGain > 0) {
            pActive.coins += greenGain;
            log(`<span class="income">${pActive.name} получает ${greenGain} из банка (Зеленые карты)</span>`);
        }

        // 4. PURPLE (Active player only)
        Object.keys(pActive.cards).forEach(cid => {
            let c = cardDatabase.find(x => x.id === cid);
            if (c.type === 'purple' && c.triggers.includes(roll)) {
                if (cid === 'c15') { // Stadium
                    let amount = Math.min(2, pOther.coins);
                    pOther.coins -= amount;
                    pActive.coins += amount;
                    log(`<span class="income">Квиддич! ${pActive.name} забирает ${amount} у ${pOther.name}</span>`);
                } else if (cid === 'c16') { // TV
                    let amount = Math.min(5, pOther.coins);
                    pOther.coins -= amount;
                    pActive.coins += amount;
                    log(`<span class="income">Пророк! ${pActive.name} забирает ${amount} у ${pOther.name}</span>`);
                } else if (cid === 'c17') { // Tax
                    if (pOther.coins >= 10) {
                        let amount = Math.floor(pOther.coins / 2);
                        pOther.coins -= amount;
                        pActive.coins += amount;
                        log(`<span class="income">Налог! ${pActive.name} забирает ${amount} у ${pOther.name}</span>`);
                    }
                }
            }
        });
    }

    // --- Market Action ---
    function buyCard(id) {
        if (turnPhase !== 'buy' || players[activePlayer].isAI) return;
        let p = players[activePlayer];
        let c = cardDatabase.find(x => x.id === id);
        
        if (p.coins >= c.cost && market[id] > 0) {
            if (c.type === 'purple' && p.cards[id]) {
                log('У вас уже есть эта фиолетовая карта!');
                return;
            }
            p.coins -= c.cost;
            market[id]--;
            if (market[id] === 0) delete market[id];
            p.cards[id] = (p.cards[id] || 0) + 1;
            log(`${p.name} покупает ${c.name}`);
            
            replenishMarket();
            finalizeTurn(true);
        }
    }

    function buyLandmark(key) {
        if (turnPhase !== 'buy' || players[activePlayer].isAI) return;
        let p = players[activePlayer];
        let l = landmarksData.find(x => x.key === key);
        
        if (p.coins >= l.cost && !p.landmarks[key]) {
            p.coins -= l.cost;
            p.landmarks[key] = true;
            log(`<b>${p.name} построил достопримечательность: ${l.name}!</b>`);
            checkWin(p);
            if(turnPhase !== 'end') finalizeTurn(true);
        }
    }

    function endTurn() {
        if (turnPhase !== 'buy') return;
        let p = players[activePlayer];
        // Airport landmark effect
        if (p.landmarks.airport) {
            p.coins += 10;
            log(`<span class="income">${p.name} получает 10 Галеонов от Аэропорта (ничего не купил)</span>`);
        }
        finalizeTurn(false);
    }

    function finalizeTurn(bought) {
        let p = players[activePlayer];
        
        if (p.landmarks.park && doubleRolled) {
            log(`<b>Замок Хогвартс дарует ${p.name} дополнительный ход за дубль!</b>`);
            turnPhase = 'roll';
            updateUI();
            if(p.isAI) setTimeout(aiTurn, 1000);
            return;
        }

        activePlayer = (activePlayer + 1) % 2;
        turnPhase = 'roll';
        updateUI();

        if (players[activePlayer].isAI) {
            setTimeout(aiTurn, 1000);
        }
    }

    // --- AI Logic ---
    function aiTurn() {
        let p = players[activePlayer];
        let numDice = p.landmarks.station ? (Math.random() > 0.5 ? 2 : 1) : 1;
        rollDice(numDice);
    }

    function aiBuyPhase() {
        if (turnPhase === 'end') return;
        let p = players[activePlayer];
        let bought = false;

        // 1. Try to buy landmark
        for (let l of landmarksData) {
            if (!p.landmarks[l.key] && p.coins >= l.cost) {
                p.coins -= l.cost;
                p.landmarks[l.key] = true;
                log(`<b>${p.name} построил ${l.name}!</b>`);
                bought = true;
                checkWin(p);
                break;
            }
        }

        // 2. Buy random affordable card from market
        if (!bought && turnPhase !== 'end') {
            let affordable = Object.keys(market).filter(id => {
                let c = cardDatabase.find(x => x.id === id);
                if (c.type === 'purple' && p.cards[id]) return false;
                return c.cost <= p.coins;
            });

            if (affordable.length > 0) {
                // Pick random
                let pick = affordable[Math.floor(Math.random() * affordable.length)];
                let c = cardDatabase.find(x => x.id === pick);
                p.coins -= c.cost;
                market[pick]--;
                if (market[pick] === 0) delete market[pick];
                p.cards[pick] = (p.cards[pick] || 0) + 1;
                log(`${p.name} покупает ${c.name}`);
                replenishMarket();
                bought = true;
            }
        }

        if (!bought && p.landmarks.airport && turnPhase !== 'end') {
             p.coins += 10;
             log(`<span class="income">${p.name} получает 10 Галеонов от Аэропорта (ничего не купил)</span>`);
        }

        if (turnPhase !== 'end') finalizeTurn(bought);
    }

    function checkWin(p) {
        let built = Object.values(p.landmarks).filter(x => x).length;
        if (built === landmarksData.length) {
            log(`<h2>🎉 ${p.name} побеждает, отстроив весь магический мир! 🎉</h2>`);
            turnPhase = 'end';
            updateUI();
        }
    }

    // --- Rendering ---
    function updateUI() {
        let pActive = players[activePlayer];
        document.getElementById('turn-indicator').innerText = turnPhase === 'end' ? 'Игра окончена' : `Ход: ${pActive.name} (${turnPhase === 'roll' ? 'Бросок' : 'Покупка'})`;

        // Buttons
        document.getElementById('btn-roll-1').style.display = (turnPhase === 'roll' && !pActive.isAI) ? 'inline-block' : 'none';
        document.getElementById('btn-roll-2').style.display = (turnPhase === 'roll' && !pActive.isAI && pActive.landmarks.station) ? 'inline-block' : 'none';
        document.getElementById('btn-end-turn').style.display = (turnPhase === 'buy' && !pActive.isAI) ? 'inline-block' : 'none';

        // Render Player Panels
        renderPlayer(0, 'p1');
        renderPlayer(1, 'p2');

        // Render Market
        let mHTML = '';
        Object.keys(market).forEach(id => {
            let c = cardDatabase.find(x => x.id === id);
            let canBuy = (turnPhase === 'buy' && !players[0].isAI && players[0].coins >= c.cost && activePlayer === 0);
            if (c.type === 'purple' && players[0].cards[id]) canBuy = false;

            mHTML += `
                <div class="card ${c.type} ${canBuy ? '' : 'disabled'}" onclick="buyCard('${id}')">
                    <div class="card-header">
                        <span class="card-triggers">[${c.triggers.join(',')}]</span>
                        <span class="card-cost">${c.cost} 💰</span>
                    </div>
                    <div style="font-weight:bold; margin-top:5px; text-align:center;">${c.icon} ${c.name}</div>
                    <div style="font-size:0.8em; margin-top:10px; color:#555;">${c.effectDesc}</div>
                    <div class="card-count">${market[id]}</div>
                </div>
            `;
        });
        document.getElementById('market-cards').innerHTML = mHTML;
    }

    function renderPlayer(index, prefix) {
        let p = players[index];
        document.getElementById(`${prefix}-coins`).innerText = `${p.coins} Галеонов`;
        
        // Render Cards
        let cHTML = '';
        Object.keys(p.cards).forEach(id => {
            let c = cardDatabase.find(x => x.id === id);
            cHTML += `
                <div class="card ${c.type}" style="cursor:default">
                    <div class="card-header">
                        <span class="card-triggers">[${c.triggers.join(',')}]</span>
                    </div>
                    <div style="font-weight:bold; margin-top:5px; text-align:center;">${c.icon} ${c.name}</div>
                    <div class="card-count" style="background:#2c3e50;">${p.cards[id]}</div>
                </div>
            `;
        });
        document.getElementById(`${prefix}-cards`).innerHTML = cHTML;

        // Render Landmarks
        let lHTML = '';
        landmarksData.forEach(l => {
            let built = p.landmarks[l.key];
            let canBuy = (!built && turnPhase === 'buy' && activePlayer === index && !p.isAI && p.coins >= l.cost);
            
            lHTML += `
                <div class="card landmark ${built ? 'built' : ''} ${(!built && !canBuy) ? 'disabled' : ''}" 
                     ${canBuy ? `onclick="buyLandmark('${l.key}')"` : ''} style="min-height: 80px;">
                    <div class="card-header">
                        <span>${l.name}</span>
                        <span class="card-cost">${l.cost} 💰</span>
                    </div>
                    <div style="font-size:0.8em; margin-top:5px;">${l.effectDesc}</div>
                </div>
            `;
        });
        document.getElementById(`${prefix}-landmarks`).innerHTML = lHTML;
    }

    function log(msg) {
        let l = document.getElementById('log');
        l.innerHTML += `<div class="log-entry">${msg}</div>`;
        l.scrollTop = l.scrollHeight;
    }

    // Start
    initGame();
</script>
</body>
</html>
